<!-- settings_rev.html -->

<!-- Settings Button -->
<button id="settingsBtn">⚙️</button>

<!-- Floating Settings Menu -->
<div id="settingsMenu" style="display: none;">
  <label>
    <input type="checkbox" id="toggle_revImages">
    <span>صور سفر الرؤيا</span>
  </label>
</div>

<!-- Styles -->
<style>
  #settingsContainer {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 9999;
    opacity: 0.6;
    transition: opacity 0.3s ease;
    font-size: 1rem;
  }

  #settingsContainer:hover {
    opacity: 1;
  }

  #settingsBtn {
    width: 2rem;
    height: 2rem;
    background-color: black;
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 1.0rem;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }

  #settingsBtn:hover {
    opacity: 1;
  }

  #settingsMenu {
    position: absolute;
    top: 40px;
    right: 0;
    background-color: black;
    color: white;
    border: 1px solid #ddd;
    padding: 0.2rem 0.5rem;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    z-index: 10000;
    opacity: 0.9;
    transition: opacity 0.3s ease;
    border-radius: 0.75rem;
    font-size: 0.8rem;
    white-space: nowrap; /* Prevent text wrapping */
  }

  #settingsMenu:hover {
    opacity: 1;
  }

  #settingsMenu label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.1rem 0;
    cursor: pointer;
    font-size: 1em;
    white-space: nowrap; /* Prevent wrapping */
  }

  #settingsMenu input[type="checkbox"] {
    width: 1em;
    height: 1em;
    flex-shrink: 0;
  }
</style>
