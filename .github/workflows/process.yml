name: Auto Clean & Prepare Source
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  process:
    runs-on: ubuntu-22.04 
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java & Tools
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Dependencies Manually
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget curl
        
        # تحميل الأدوات في فولدر مؤقت عشان ميتلخبطش مع ملفاتك
        mkdir -p $HOME/tools
        
        # 1. تحميل jadx
        curl -fsSL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.4.7/jadx-1.4.7.zip
        unzip -q /tmp/jadx.zip -d $HOME/tools/jadx
        echo "$HOME/tools/jadx/bin" >> $GITHUB_PATH
        
        # 2. تحميل أدوات أندرويد
        curl -fsSL -o /tmp/build-tools.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
        unzip -q /tmp/build-tools.zip -d $HOME/tools/
        echo "$HOME/tools/android-14" >> $GITHUB_PATH
        
        # 3. تحميل Apktool
        curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
        sudo mv /tmp/apktool.jar /usr/local/bin/
        echo '#!/bin/bash
        exec java -jar /usr/local/bin/apktool.jar "$@"' > apktool
        chmod +x apktool
        sudo mv apktool /usr/local/bin/
        
        # 4. تحميل Disrobe (الرابط الصح)
        curl -fsSL -o /tmp/disrobe.tar.gz https://github.com/1-3-7/disrobe/releases/download/v0.8.6/disrobe-linux-amd64.tar.gz
        tar -xzf /tmp/disrobe.tar.gz -C /tmp/
        sudo mv /tmp/disrobe /usr/local/bin/
        chmod +x /usr/local/bin/disrobe

    - name: Unzip & Organize
      run: |
        mkdir -p workspace/source workspace/output
        find . -name "*.zip" -not -path "./.git/*" -exec unzip -o {} -d workspace/source \;
        find workspace/source -name "*.apk" -exec mv {} workspace/ \;

    - name: Deobfuscate and Extract
      run: |
        cd workspace
        for apk in *.apk; do
          if [ -f "$apk" ]; then
            echo "Processing $apk..."
            apktool d "$apk" -o "decompiled_${apk%.*}" -f
            
            disrobe auto "$apk" --out "deobfuscated_${apk%.*}" || true
            
            if [ -d "deobfuscated_${apk%.*}" ]; then
              find "deobfuscated_${apk%.*}" -type f -exec echo "--- Content of {} ---" \; -exec cat {} \; > "extracted_text_${apk%.*}.txt"
            fi
          fi
        done

    - name: Remove Copyright and Proprietary Data
      run: |
        cd workspace
        KEYWORDS="Copyright|All rights reserved|Proprietary|حقوق الملكية|©"
        find . -type f \( -name "*.xml" -o -name "*.smali" -o -name "*.java" \) -exec sed -i -E "/$KEYWORDS/d" {} \;
        find . -type f \( -iname "*license*" -o -iname "*copyright*" -o -iname "*notice*" \) -delete

    - name: Final Review and Repack
      run: |
        cd workspace
        echo "--- Final Security Scan ---"
        grep -r -E "Copyright|Proprietary|حقوق الملكية" . || echo "Clean! No copyright found."
        
        for dir in decompiled_*; do
          if [ -d "$dir" ]; then
            apktool b "$dir" -o "../output/clean_${dir}.apk"
          fi
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Cleaned-Source-Files
        path: |
          workspace/output/
          workspace/extracted_text_*.txt
