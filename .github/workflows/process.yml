name: Auto Clean & Prepare Source
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  process:
    runs-on: ubuntu-22.04 
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java & Tools
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Dependencies Manually
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget curl
        
        # 1. تنزيل jadx (لأنه مش موجود في apt)
        wget -q https://github.com/skylot/jadx/releases/download/v1.4.7/jadx-1.4.7.zip
        unzip -q jadx-1.4.7.zip -d jadx_tool
        echo "$PWD/jadx_tool/bin" >> $GITHUB_PATH
        
        # 2. تنزيل أدوات أندرويد (zipalign و apksigner) من جوجل
        wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
        unzip -q build-tools_r34-linux.zip
        echo "$PWD/android-14" >> $GITHUB_PATH
        
        # 3. تنزيل disrobe لفك التشفير
        wget -q https://github.com/1-3-7/disrobe/releases/latest/download/disrobe-linux -O disrobe
        chmod +x disrobe
        sudo mv disrobe /usr/local/bin/
        
        # 4. تنزيل Apktool
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        echo '#!/bin/bash
        exec java -jar /home/runner/work/Library-/Library-/apktool.jar "$@"' > apktool
        chmod +x apktool
        sudo mv apktool /usr/local/bin/

    - name: Unzip & Organize
      run: |
        mkdir -p workspace/source workspace/output
        # فك ضغط أي ملفات zip في الريبو
        find . -name "*.zip" -not -path "./.git/*" -exec unzip -o {} -d workspace/source \;
        # تجميع ملفات APK في فولدر واحد
        find workspace/source -name "*.apk" -exec mv {} workspace/ \;

    - name: Deobfuscate and Extract
      run: |
        cd workspace
        for apk in *.apk; do
          if [ -f "$apk" ]; then
            echo "Processing $apk..."
            apktool d "$apk" -o "decompiled_${apk%.*}" -f
            
            # محاولة فك التشفير
            disrobe auto "$apk" --out "deobfuscated_${apk%.*}" || true
            
            # استخراج النصوص
            if [ -d "deobfuscated_${apk%.*}" ]; then
              find "deobfuscated_${apk%.*}" -type f -exec echo "--- Content of {} ---" \; -exec cat {} \; > "extracted_text_${apk%.*}.txt"
            fi
          fi
        done

    - name: Remove Copyright and Proprietary Data
      run: |
        cd workspace
        KEYWORDS="Copyright|All rights reserved|Proprietary|حقوق الملكية|©"
        # مسح الأسطر اللي فيها كلمات الحقوق من الملفات النصية
        find . -type f \( -name "*.xml" -o -name "*.smali" -o -name "*.java" \) -exec sed -i -E "/$KEYWORDS/d" {} \;
        # مسح ملفات التراخيص
        find . -type f \( -iname "*license*" -o -iname "*copyright*" -o -iname "*notice*" \) -delete

    - name: Final Review and Repack
      run: |
        cd workspace
        echo "--- Final Security Scan ---"
        grep -r -E "Copyright|Proprietary|حقوق الملكية" . || echo "Clean! No copyright found."
        
        # إعادة بناء الـ APK
        for dir in decompiled_*; do
          if [ -d "$dir" ]; then
            apktool b "$dir" -o "../output/clean_${dir}.apk"
          fi
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Cleaned-Source-Files
        path: |
          workspace/output/
          workspace/extracted_text_*.txt
