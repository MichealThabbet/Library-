name: Extract incoming archives (excluding orsozoxi)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-incoming-archives.yml'
permissions:
  contents: write
concurrency:
  group: extract-incoming-archives
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install archive extractors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - name: Extract archives without overwriting existing files
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile, tarfile, subprocess, shutil, tempfile, json, stat, re
          root=pathlib.Path("incoming")
          excluded={"orsozoxi","orsozxi"}
          exts=(".zip",".7z",".rar",".tar",".tar.gz",".tgz",".tar.bz2",".tbz2",".tar.xz",".txz")
          report={"extracted":[],"skipped":[],"errors":[]}
          max_files=30000
          max_bytes=2*1024**3
          def is_archive(p): return p.name.lower().endswith(exts)
          def eligible(p): return not any(part.lower() in excluded or part.lower()=="__macosx" for part in p.parts) and not p.name.startswith("._")
          def safe_name(name):
            name=name.replace("\\","/")
            p=pathlib.PurePosixPath(name)
            return bool(name and not name.startswith("/") and not name.startswith("//") and not any(x==".." for x in p.parts) and not (p.parts and ":" in p.parts[0]))
          def parts_for(archive):
            m=re.match(r"(?i)^(.*?)(?:[._]part(\d{3})|part(\d+))\.zip$",archive.name)
            if not m: return None
            prefix=m.group(1)
            numbered=[]
            for q in archive.parent.iterdir():
              qm=re.match(r"(?i)^"+re.escape(prefix)+r"(?:[._]part(\d{3})|part(\d+))\.zip$",q.name)
              if qm: numbered.append((int(qm.group(1) or qm.group(2)),q))
            numbered.sort()
            if not numbered or numbered[0][0]!=1 or [x[0] for x in numbered]!=list(range(1,len(numbered)+1)):
              raise ValueError("Missing or non-contiguous multipart pieces")
            return [q for _,q in numbered]
          def extract(archive):
            dest=archive.parent
            with tempfile.TemporaryDirectory(dir=dest) as tmp:
              out=pathlib.Path(tmp)/"extracted"
              out.mkdir()
              parts=parts_for(archive)
              source=archive
              if parts:
                source=pathlib.Path(tmp)/"combined.zip"
                with open(source,"wb") as joined:
                  for part in parts:
                    with open(part,"rb") as f: shutil.copyfileobj(f,joined)
                print("COMBINED",str(archive),"parts",len(parts))
              if zipfile.is_zipfile(source):
                with zipfile.ZipFile(source) as z:
                  entries=z.infolist()
                  if len(entries)>max_files or sum(i.file_size for i in entries)>max_bytes: raise ValueError("archive limits exceeded")
                  for i in entries:
                    if not safe_name(i.filename): raise ValueError("unsafe archive path")
                    if stat.S_ISLNK(i.external_attr>>16): report["skipped"].append(str(archive)+" : symlink "+i.filename)
                  for i in entries:
                    if not stat.S_ISLNK(i.external_attr>>16): z.extract(i,out)
              elif tarfile.is_tarfile(source):
                with tarfile.open(source) as t:
                  members=t.getmembers()
                  if len(members)>max_files or sum(i.size for i in members)>max_bytes: raise ValueError("archive limits exceeded")
                  for m in members:
                    if not safe_name(m.name) or not (m.isfile() or m.isdir()): raise ValueError("unsafe tar entry")
                  t.extractall(out,filter="data")
              else:
                listing=subprocess.run(["7z","l","-slt",str(source.resolve())],capture_output=True,text=True)
                if listing.returncode: raise ValueError("7z cannot list archive: "+listing.stderr[-300:])
                # 7z extracts only to a staging directory, never directly into the repository.
                result=subprocess.run(["7z","x","-y","-o"+str(out.resolve()),str(source.resolve())],capture_output=True,text=True)
                if result.returncode: raise ValueError("7z extraction failed: "+result.stderr[-300:])
              staged=[p for p in out.rglob("*") if p.is_file()]
              if len(staged)>max_files or sum(p.stat().st_size for p in staged)>max_bytes: raise ValueError("extracted archive limits exceeded")
              count=0
              for item in staged:
                if item.is_symlink(): raise ValueError("symlink produced by archive")
                relative=item.relative_to(out)
                if not safe_name(relative.as_posix()): raise ValueError("unsafe extracted path")
                target=dest/relative
                if not eligible(target) or target.exists():
                  report["skipped"].append(str(target))
                  continue
                target.parent.mkdir(parents=True,exist_ok=True)
                
                shutil.copyfile(item,target)
                count+=1
              return count
          seen=set()
          for round_num in range(5):
            files=sorted((p for p in root.rglob("*") if p.is_file() and is_archive(p) and eligible(p) and str(p) not in seen),key=str)
            if not files: break
            for p in files:
              seen.add(str(p))
              if re.search(r"(?i)(?:[._]part(\d{3})|part(\d+))\.zip$",p.name) and not re.search(r"(?i)(?:[._]part001|part1)\.zip$",p.name):
                report["skipped"].append(str(p)+" (multipart continuation)")
                continue
              try:
                n=extract(p)
                report["extracted"].append({"archive":str(p),"new_files":n})
                print(f"EXTRACTED {p}: {n} new files")
              except Exception as e:
                report["errors"].append({"archive":str(p),"error":str(e)})
                print(f"ERROR {p}: {e}")
          pathlib.Path("archive-extraction-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print("SUMMARY",json.dumps({k:len(v) for k,v in report.items()}))
          if report["errors"]: print("WARNING: Some archives failed; committing successful extractions and report")
          PY
      - name: Reassemble and extract nested split archives
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, hashlib, tempfile, shutil, zipfile, tarfile, subprocess, json, os, stat
          root=pathlib.Path("incoming")
          report_path=pathlib.Path("archive-extraction-report.json")
          report=json.loads(report_path.read_text())
          report.setdefault("nested",[])
          errors=[]
          for folder in sorted(p for p in root.rglob("*") if p.is_dir()):
            if any(v.lower() in ("orsozxi","orsozoxi") for v in folder.parts): continue
            chunks=[]
            for p in folder.iterdir():
              m=re.fullmatch(r"archive\.part(\d{3})",p.name,re.I) if p.is_file() else None
              if m: chunks.append((int(m.group(1)),p))
            if not chunks: continue
            chunks.sort()
            status={"folder":str(folder),"parts":len(chunks),"new_files":0}
            try:
              if [n for n,_ in chunks]!=list(range(1,len(chunks)+1)):
                raise ValueError("Missing archive.part pieces")
              with tempfile.TemporaryDirectory() as td:
                tmp=pathlib.Path(td)
                joined=tmp/"joined.archive"
                digest=hashlib.sha256()
                with joined.open("wb") as out:
                  for _,part in chunks:
                    with part.open("rb") as src:
                      while True:
                        buf=src.read(1024*1024)
                        if not buf: break
                        digest.update(buf)
                        out.write(buf)
                status["sha256"]=digest.hexdigest()
                sha_file=folder/"sha256.txt"
                if sha_file.exists():
                  reference=sha_file.read_text().strip().split()[0].lower()
                  if len(reference)==64 and reference!=status["sha256"]:
                    raise ValueError("SHA256 mismatch; reconstructed archive is corrupted")
                output=tmp/"files"
                output.mkdir()
                if zipfile.is_zipfile(joined):
                  with zipfile.ZipFile(joined) as z:
                    infos=z.infolist()
                    if len(infos)>30000 or sum(i.file_size for i in infos)>2*1024**3:
                      raise ValueError("Archive exceeds file/size limits")
                    for i in infos:
                      parts=pathlib.PurePosixPath(i.filename.replace("\\","/"))
                      if parts.is_absolute() or ".." in parts.parts or stat.S_ISLNK(i.external_attr>>16):
                        raise ValueError("Unsafe zip member")
                    z.extractall(output)
                elif tarfile.is_tarfile(joined):
                  with tarfile.open(joined) as t:
                    members=t.getmembers()
                    if len(members)>30000 or sum(m.size for m in members)>2*1024**3:
                      raise ValueError("Archive exceeds file/size limits")
                    if any(not (m.isfile() or m.isdir()) for m in members):
                      raise ValueError("Unsafe tar member")
                    t.extractall(output,filter="data")
                else:
                  proc=subprocess.run(["7z","x","-y","-o"+str(output),str(joined)],capture_output=True,text=True)
                  if proc.returncode: raise ValueError("Reassembled content is not supported archive: "+proc.stderr[-200:])
                staged=list(output.rglob("*"))
                if len(staged)>30000: raise ValueError("Too many extracted entries")
                target_dir=folder/"extracted"
                for item in staged:
                  if not item.is_file(): continue
                  if item.is_symlink(): raise ValueError("Unexpected symlink")
                  relative=item.relative_to(output)
                  target=target_dir/relative
                  if target.exists(): continue
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(item,target)
                  status["new_files"]+=1
              status["status"]="ok"
            except Exception as exc:
              status["status"]="error"
              status["error"]=str(exc)
              errors.append(status)
            report["nested"].append(status)
            print("NESTED",json.dumps(status,ensure_ascii=False))
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          if errors:
            print("Nested archive failures:",len(errors))
          PY
      - name: Extract remaining split files of any extension
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,os,tempfile,shutil,zipfile,tarfile,subprocess,json,stat,sys
          root=pathlib.Path("incoming")
          excluded={"orsozxi","orsozoxi"}
          results=[]
          errors=[]
          pattern=re.compile(r"(?i)^(.*)\.part(\d+)$")
          for folder in sorted(p for p in root.rglob("*") if p.is_dir() and not any(a.lower() in excluded for a in p.parts)):
            groups={}
            for p in folder.iterdir():
              if not p.is_file(): continue
              m=pattern.match(p.name)
              if m: groups.setdefault(m.group(1),[]).append((int(m.group(2)),p))
            if len(groups)>1 and all(len(v)==1 for v in groups.values()):
              all_parts=sorted((entry for values in groups.values() for entry in values),key=lambda x:x[0])
              if [num for num,_ in all_parts]==list(range(1,len(all_parts)+1)):
                groups={all_parts[0][1].name.rsplit(".part",1)[0]:all_parts}
            for name,parts in sorted(groups.items()):
              parts.sort()
              item={"folder":str(folder),"archive":name,"pieces":len(parts),"new_files":0}
              try:
                nums=[n for n,p in parts]
                if nums!=list(range(1,len(nums)+1)):
                  raise ValueError("Missing or nonconsecutive parts")
                with tempfile.TemporaryDirectory() as td:
                  tmp=pathlib.Path(td)
                  combined=tmp/"joined"
                  with combined.open("wb") as dest:
                    for _,part in parts:
                      with part.open("rb") as src: shutil.copyfileobj(src,dest)
                  out=tmp/"unpacked"
                  out.mkdir()
                  if zipfile.is_zipfile(combined):
                    with zipfile.ZipFile(combined) as archive:
                      members=archive.infolist()
                      if len(members)>50000 or sum(x.file_size for x in members)>3*1024**3: raise ValueError("Archive exceeds safety limits")
                      for m in members:
                        path=pathlib.PurePosixPath(m.filename.replace(chr(92),"/"))
                        if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(m.external_attr>>16): raise ValueError("Unsafe member")
                      archive.extractall(out)
                  elif tarfile.is_tarfile(combined):
                    with tarfile.open(combined) as archive:
                      members=archive.getmembers()
                      if len(members)>50000 or sum(x.size for x in members)>3*1024**3: raise ValueError("Archive exceeds safety limits")
                      if any(not(x.isfile() or x.isdir()) for x in members): raise ValueError("Unsafe member")
                      archive.extractall(out,filter="data")
                  else:
                    command=subprocess.run(["7z","x","-y","-o"+str(out),str(combined)],capture_output=True,text=True)
                    if command.returncode: raise ValueError("Cannot decompress joined file: "+command.stderr[-300:])
                  files=[p for p in out.rglob("*") if p.is_file()]
                  if len(files)>50000 or sum(p.stat().st_size for p in files)>3*1024**3: raise ValueError("Extraction exceeds safety limits")
                  for p in files:
                    if p.is_symlink(): raise ValueError("Symlink in output")
                    relative=p.relative_to(out)
                    target=folder/"extracted"/relative
                    if target.exists(): continue
                    target.parent.mkdir(parents=True,exist_ok=True)
                    shutil.copyfile(p,target)
                    item["new_files"]+=1
                item["status"]="ok"
              except Exception as exc:
                item["status"]="error"
                item["error"]=str(exc)
                errors.append(item)
              results.append(item)
              print("SPLIT",json.dumps(item,ensure_ascii=False))
          pathlib.Path("archive-split-report.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+chr(10))
          if errors: print("SPLIT ERRORS",len(errors))
          PY
      - name: Extract ZIP files found inside extracted archives
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json,shutil,stat,sys
          root=pathlib.Path("incoming")
          excluded={"orsozxi","orsozoxi","__MACOSX"}
          def valid(p): return not any(x.lower() in {e.lower() for e in excluded} for x in p.parts) and not p.name.startswith("._")
          results=[]
          seen=set()
          for iteration in range(6):
            archives=sorted((p for p in root.rglob("*.zip") if p.is_file() and valid(p) and "extracted" in p.parts and str(p) not in seen),key=str)
            if not archives: break
            for p in archives:
              seen.add(str(p))
              record={"archive":str(p),"new_files":0}
              try:
                if not zipfile.is_zipfile(p): raise ValueError("Invalid ZIP archive")
                with zipfile.ZipFile(p) as z:
                  infos=z.infolist()
                  if len(infos)>50000 or sum(i.file_size for i in infos)>3*1024**3: raise ValueError("Archive limits exceeded")
                  for i in infos:
                    name=i.filename.replace(chr(92),"/")
                    parts=pathlib.PurePosixPath(name)
                    if parts.is_absolute() or ".." in parts.parts or stat.S_ISLNK(i.external_attr>>16): raise ValueError("Unsafe ZIP member")
                  destination=p.parent/(p.stem+"_extracted")
                  for member in infos:
                    if member.is_dir(): continue
                    target=destination/member.filename
                    if target.exists(): continue
                    target.parent.mkdir(parents=True,exist_ok=True)
                    with z.open(member) as src,target.open("xb") as dst: shutil.copyfileobj(src,dst)
                    record["new_files"]+=1
                record["status"]="ok"
              except Exception as e:
                record["status"]="error"
                record["error"]=str(e)
              results.append(record)
              print("NESTED_ZIP",json.dumps(record,ensure_ascii=False))
          pathlib.Path("archive-nested-zip-report.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+chr(10))
          PY
      - name: Audit all incoming folders and extraction results
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,sys
          root=pathlib.Path("incoming")
          report=json.loads(pathlib.Path("archive-extraction-report.json").read_text())
          excluded={"orsozxi","orsozoxi"}
          folders=sorted(p for p in root.iterdir() if p.is_dir() and p.name.lower() not in excluded)
          extensions=(".zip",".rar",".7z",".tar",".tgz",".tar.gz",".tar.xz",".tar.bz2")
          archives=[p for folder in folders for p in folder.rglob("*") if p.is_file() and p.name.lower().endswith(extensions) and not any(x.lower() in excluded or x.lower()=="__macosx" for x in p.parts) and not p.name.startswith("._")]
          completed={x["archive"] for x in report.get("extracted",[])}
          continuations=[p for p in archives if " (multipart continuation)" in "\n".join(report.get("skipped",[])) and str(p)+" (multipart continuation)" in report.get("skipped",[])]
          nested_zip=json.loads(pathlib.Path("archive-nested-zip-report.json").read_text())
          completed_nested={x["archive"] for x in nested_zip if x.get("status")=="ok"}
          missing=[str(p) for p in archives if str(p) not in completed and str(p) not in completed_nested and p not in continuations]
          split=json.loads(pathlib.Path("archive-split-report.json").read_text())
          failures=report.get("errors",[])+[x for x in report.get("nested",[]) if x.get("status")!="ok"]+[x for x in split if x.get("status")!="ok"]+[x for x in nested_zip if x.get("status")!="ok"]
          summary={"folders_checked":len(folders),"archive_files":len(archives),"archives_processed":len(completed),"multipart_continuations":len(continuations),"nested_archives":len(report.get("nested",[])),"unprocessed":missing,"failures":failures}
          pathlib.Path("archive-extraction-audit.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n")
          print("AUDIT",json.dumps(summary,ensure_ascii=False))
          if missing or failures: print("AUDIT FOUND ISSUES: see archive-extraction-audit.json")
          PY
      - name: Commit extracted files and report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- incoming archive-extraction-report.json archive-extraction-audit.json archive-split-report.json archive-nested-zip-report.json
          if git diff --cached --quiet; then
            echo "No new files."
          else
            git commit -m "Extract incoming archives, excluding orsozoxi"
            git -c http.postBuffer=524288000 push
          fi
      - name: Fail if extraction audit is incomplete
        shell: bash
        run: |
          python3 - <<'PY'
          import json,sys
          report=json.load(open("archive-extraction-audit.json"))
          if report["unprocessed"] or report["failures"]:
            sys.exit("Archive audit incomplete; review archive-extraction-audit.json")
          print("ALL ARCHIVES ACCOUNTED FOR")
          PY
